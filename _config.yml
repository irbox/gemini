# The Lovelace Journal - Jekyll Configuration
# Standard Jekyll 4.x & GitHub Pages Architecture

# Site Metadata
title: "The Lovelace Journal"
tagline: "Perspectives on Frontier Computing, Intelligence & Engineering"
description: "Original perspectives, breakthroughs, and architectural insights in artificial intelligence, custom silicon, quantum computing, and autonomous robotics."
url: "https://irbox.github.io"
baseurl: "/gemini"
locale: "en-US"
timezone: "America/Los_Angeles"
author: "The Lovelace Editorial Board"
email: "editorial@lovelace-journal.org"

# Content Collections & Permalinks
collections:
  posts:
    output: true
    permalink: /:categories/:year/:month/:day/:title/

# Front Matter Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "ada-lovelace"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Markdown & Syntax Highlighting
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

# Sass / SCSS Configuration
sass:
  sass_dir: _sass
  style: compressed

# Supported GitHub Pages Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Pagination
paginate: 9
paginate_path: "/page:num/"

# Files & Directories to Exclude
exclude:
  - Gemfile.lock
  - node_modules/
  - package.json
  - package-lock.json
  - test/
  - scripts/
  - .github/workflows/deploy.yml
  - attachments/

# Assets to Include
include:
  - assets
