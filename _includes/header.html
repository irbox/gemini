<header class="site-header">
  <div class="container site-header__inner">
    <a href="{{ '/' | relative_url }}" class="site-header__brand">
      <img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="{{ site.title }}" class="brand-logo" width="36" height="36">
      <span class="brand-title">{{ site.title }}</span>
    </a>

    <nav class="site-header__nav" aria-label="Main Navigation">
      {% for item in site.data.navigation.main %}
        {% assign is_active = false %}
        {% if page.url == item.url %}
          {% assign is_active = true %}
        {% endif %}
        <a href="{{ item.url | relative_url }}" class="nav-link{% if is_active %} is-active{% endif %}">
          {{ item.title }}
        </a>
      {% endfor %}
    </nav>

    <div class="site-header__actions">
      <button class="site-header__search-btn" data-search-trigger aria-label="Search stories">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span>Search</span>
        <span class="search-key">/</span>
      </button>

      <button class="site-header__toggle" data-menu-toggle aria-label="Toggle menu" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>
</header>

<!-- Mobile Navigation Drawer -->
<div class="mobile-drawer" data-mobile-drawer>
  {% for item in site.data.navigation.main %}
    <a href="{{ item.url | relative_url }}" class="mobile-link">
      {{ item.title }}
    </a>
  {% endfor %}
</div>
