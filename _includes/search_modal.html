<div class="search-modal" data-search-modal data-baseurl="{{ site.baseurl }}">
  <div class="search-modal__content">
    <div class="search-modal__header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" placeholder="Search research papers, engineering deep dives, architectures..." data-search-input aria-label="Search stories">
      <button class="close-btn" data-close-search aria-label="Close search">✕</button>
    </div>
    <div class="search-modal__results" data-search-results></div>
  </div>
</div>
