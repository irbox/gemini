<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} | {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | escape }}"/>

<!-- Google Web Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Product+Sans:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- Main Compiled Jekyll Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
<meta property="og:title" content="{{ page.title | default: site.title | escape }}"/>
<meta property="og:description" content="{{ page.description | default: site.description | escape }}" />
<meta property="og:image" content="{% if page.hero_image %}{{ page.hero_image | absolute_url }}{% else %}{{ '/storage.googleapis.com/gweb-uniblog-publish-prod/images/SocialShare_gradient.max-1440x810.jpg' | absolute_url }}{% endif %}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:site_name" content="{{ site.title }}" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}"/>
<meta name="twitter:description" content="{{ page.description | default: site.description | escape }}" />
<meta name="twitter:image" content="{% if page.hero_image %}{{ page.hero_image | absolute_url }}{% else %}{{ '/storage.googleapis.com/gweb-uniblog-publish-prod/images/SocialShare_gradient.max-1440x810.jpg' | absolute_url }}{% endif %}" />
<meta name="twitter:site" content="@google" />

<!-- Canonical & Favicons -->
<link rel="canonical" href="{{ page.url | absolute_url }}"/>
<link rel="icon" type="image/x-icon" href="{{ '/static/blogv2/images/favicon.ico' | relative_url }}"/>
<link rel="apple-touch-icon" href="{{ '/static/blogv2/images/apple-touch-icon.png' | relative_url }}"/>
