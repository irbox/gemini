      title={Fault-Tolerant Surface Codes at Distance-7 on 128 Superconducting Transmons},
      author={Vance, Marcus and Shannon, Clara},
      journal={PRX Quantum},
      volume={7},
      number={2},
      pages={020341},
      year={2026}
    }

- id: "in-browser-shaders"
  title: "Zero-Copy KV-Cache Streaming via WebGPU Compute Shaders"
  authors: ["Ada Lovelace", "Kai Chen"]
  venue: "ACM Web3D / Systems 2026"
  year: 2026
  area: "Applied AI & Sciences"
  slug: "applied-ai"
  abstract: "Executing multi-billion parameter foundational models in client web browsers requires overcoming memory transfer overhead between JavaScript heaps and GPU VRAM. We design a zero-copy circular ring-buffer in WebGPU compute pipelines that sustains 48 tokens/second streaming on consumer laptops."
  pdf_url: "#"
  bibtex: |
