      pages={112--124},
      year={2026}
    }

- id: "chrono-ppg"
  title: "Continuous Photometric Micro-Sensor Arrays for On-Die Hemodynamic Profiling"
  authors: ["Sarah Jenkins", "Elena Rostova"]
  venue: "Nature Digital Medicine 2026"
  year: 2026
  area: "Biosensors & Health"
  slug: "biosensors-health"
  abstract: "We introduce a wearable multi-spectral photoplethysmography sensor consuming less than 1.2 mW active power. Using an embedded spiking neural network running on an on-die 16-bit RISC-V microcontroller, the system achieves 99.4% correlation with invasive arterial pressure lines."
