- id: "astra-slam"
  title: "Radiation-Hardened Asynchronous Visual SLAM for Deep-Space Interplanetary Explorers"
  authors: ["Elena Rostova", "Marcus Vance"]
  venue: "IEEE Transactions on Robotics (T-RO) 2026"
  year: 2026
  area: "Autonomous Robotics"
  slug: "autonomous-robotics"
  abstract: "Deep-space surface explorers cannot rely on GPS or high-frequency Earth communication. We present an event-camera visual-inertial SLAM architecture hardened against single-event upsets (SEU) with asynchronous consensus across triply-redundant compute nodes."
