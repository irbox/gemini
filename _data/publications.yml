- id: "hydrogen-mcts"
  title: "Monte Carlo Trajectory Synthesis in Recursive Reasoning Models"
  authors: ["Ada Lovelace", "Marcus Vance", "Clara Shannon"]
  venue: "NeurIPS 2026 (Oral)"
  year: 2026
  area: "Foundational ML & Reasoning"
  slug: "foundational-ml"
  abstract: "We formulate recursive reasoning as stochastic pathfinding across dynamic inference graphs. By coupling an adaptive value estimator with tree-search rollout policies, our model Hydrogen-4 achieves a 42% reduction in search branching factor while demonstrating superhuman verification accuracy on formal proof benchmarks."
