      year={2026}
    }

- id: "matrix-photonic"
  title: "Sub-Picosecond Optical Routing in Scalable Matrix Silicon"
  authors: ["Kai Chen", "Ada Lovelace", "Elena Rostova"]
  venue: "IEEE Micro / Hot Chips 2026"
  year: 2026
  area: "Hardware & Custom Silicon"
  slug: "hardware-silicon"
  abstract: "Modern transformer workloads are constrained by off-chip bandwidth bottlenecks. We introduce a hybrid 3nm silicon coprocessor integrating CMOS systolic tensor execution cores with on-interposer micro-ring photonic resonators, achieving 18.4 TB/s bisection bandwidth at 0.38 pJ/bit transmission energy."
  pdf_url: "#"
  bibtex: |
    @article{chen2026photonic,
      title={Sub-Picosecond Optical Routing in Scalable Matrix Silicon},
      author={Chen, Kai and Lovelace, Ada and Rostova, Elena},
      journal={IEEE Micro},
      volume={46},
      number={3},
      pages={44--56},
      year={2026}
    }

- id: "surface-code-distance7"
  title: "Fault-Tolerant Surface Codes at Distance-7 on 128 Superconducting Transmons"
  authors: ["Marcus Vance", "Clara Shannon"]
  venue: "PRX Quantum 2026"
  year: 2026
  area: "Quantum & Error Mitigation"
  slug: "quantum-systems"
  abstract: "We demonstrate continuous fault-tolerant syndromic decoding on a planar square lattice of 128 transmon qubits. Operating at 12 mK, our distance-7 surface code achieves a logical error suppression factor of Lambda = 2.41 per code distance increment, surpassing the fault-tolerance threshold."
